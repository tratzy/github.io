<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - NexturaStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-overlay" style="display: none;"><div class="spinner"></div></div>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Daftar Nextura<span>Store</span></h2>
            <p>Buat akun baru untuk mulai berbelanja.</p>
            
            <div id="error-message" class="error-box"></div>

            <form id="register-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="nama@email.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Minimal 6 karakter">
                </div>
                <button type="submit" class="btn btn-primary" id="btn-register">Daftar Sekarang</button>
            </form>

            <div class="auth-links">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, createUserWithEmailAndPassword, onAuthStateChanged } from './firebase.js';

        const registerForm = document.getElementById('register-form');
        const errorDiv = document.getElementById('error-message');
        const loadingOverlay = document.getElementById('loading-overlay');

        // Proteksi: Kalau sudah login, lempar ke home
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "index.html";
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Sembunyikan error lama & tampilkan loading
            errorDiv.style.display = 'none';
            loadingOverlay.style.display = 'flex';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                // Berhasil: Redirect diurus oleh onAuthStateChanged
            } catch (error) {
                loadingOverlay.style.display = 'none';
                
                let message = "Gagal mendaftar. Silakan coba lagi.";

                // Filter Error Firebase
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        message = "Email ini sudah terdaftar. Pakai email lain atau langsung login.";
                        break;
                    case 'auth/weak-password':
                        message = "Sandi terlalu lemah. Minimal harus 6 karakter ya.";
                        break;
                    case 'auth/invalid-email':
                        message = "Format email salah. Cek lagi penulisannya.";
                        break;
                    default:
                        message = "Error: " + error.message;
                }

                // Tampilkan ke halaman
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';

                // Hilangkan pesan setelah 5 detik
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
