<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - NexturaStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-overlay"><div class="spinner"></div></div>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Daftar Nextura<span>Store</span></h2>
            <p>Buat akun baru untuk mulai berbelanja.</p>
            
            <form id="register-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="nama@email.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Minimal 6 karakter">
                </div>
                <button type="submit" class="btn btn-primary" id="btn-register">Daftar Sekarang</button>
            </form>

            <div class="auth-links">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, createUserWithEmailAndPassword, onAuthStateChanged } from './firebase.js';

        const loadingOverlay = document.getElementById('loading-overlay');
        const registerForm = document.getElementById('register-form');

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "index.html";
            else loadingOverlay.style.display = 'none';
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loadingOverlay.style.display = 'flex';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                // Redirect otomatis dari onAuthStateChanged
            } catch (error) {
                loadingOverlay.style.display = 'none';
                alert("Registrasi gagal: " + error.message);
            }
        });
    </script>
</body>
</html>
