<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexturaStore - Premium Tech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-overlay"><div class="spinner"></div></div>

    <nav class="navbar">
        <div class="nav-left">
            <i class="fas fa-bars"></i>
            <a href="index.html" class="logo">Nextura<span>Store</span></a>
        </div>
        <div class="nav-right">
            <i class="fas fa-search"></i>
            <div id="theme-toggle"></div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <div>
                <h2>Selamat datang, <span id="user-name" style="color:var(--primary-blue)">Pengguna</span>! 👋</h2>
                <p style="color:var(--text-muted); margin-top: 5px;">Temukan gadget premium incaranmu hari ini.</p>
            </div>
            <button id="btn-logout" class="btn btn-google" style="margin-top:0; width:auto; padding:0.5rem 1rem;">
                <i class="fas fa-sign-out-alt"></i> Keluar
            </button>
        </div>

        <div id="product-grid" class="product-grid">
            </div>
    </div>

    <script type="module" src="script.js"></script>

    <script type="module">
        import { auth, onAuthStateChanged, signOut } from './firebase.js';
        import { renderProducts } from './script.js';

        const loadingOverlay = document.getElementById('loading-overlay');
        const userNameSpan = document.getElementById('user-name');
        const btnLogout = document.getElementById('btn-logout');

        // Proteksi Halaman
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Jika belum login, tendang ke halaman login
                window.location.href = "login.html";
            } else {
                // Jika sudah login, tampilkan halaman dan load data
                loadingOverlay.style.display = 'none';
                
                // Ambil nama dari Google Login atau gunakan bagian depan email
                const displayName = user.displayName || user.email.split('@')[0];
                userNameSpan.textContent = displayName;
                
                // Render Produk
                renderProducts();
            }
        });

        // Logika Logout
        btnLogout.addEventListener('click', async () => {
            try {
                await signOut(auth);
                // onAuthStateChanged akan otomatis redirect ke login.html
            } catch (error) {
                alert("Gagal keluar: " + error.message);
            }
        });
    </script>
</body>
</html>
